services:
  redis:
    image: redis:7-alpine
    container_name: go-ratelimiter-redis
    ports:
      - "6379:6379"
    # No persistence: this is a rate limiter lab, every key is disposable.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
